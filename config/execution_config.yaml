enabled: true
# When enabled is true, set dry_run to false to allow order_send.
# scripts/run_loop.py ignores this and only trades with an explicit --live flag.
dry_run: true

# Use signal-provided volume directly (lets the LLM pick the lot size -- not recommended).
use_signal_volume: false
# Size volume from risk fraction + stop distance (ignored if use_signal_volume is true).
# A volume proposed by the LLM can only shrink this size, never grow it.
use_risk_sizing: true

# Default volume if sizing is not implemented yet.
default_volume: 0.01

# MT5 order parameters
magic: 20250121
comment: "multi-agent-quant"
deviation: 20

# Safety filters
max_spread_pips: 3.0
require_tick_bid_ask: true
# Optional session filters; set to a number to enforce.
min_session_deals: null
min_session_volume: null
enforce_safety: true

# Position management for existing trades
position_management:
  enabled: true
  close_on_opposite: true
  allow_reverse: true
  allow_scale_in: true
  update_stops_on_same_direction: true
  update_stops_on_hold: true
  sl_tp_reference: "current"  # current or entry
